# Build padavan-ng firmware for several Xiaomi targets with the bundled
# OpenVPN replaced by a newer release and XOR/scramble-patched (see pre-build.sh).
# Each target's board config lives under configs/.
name: Build padavan (XOR, multi-target)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      openvpn_version:
        description: "OpenVPN version to build in (XOR patch set must exist in patches/openvpn-xor-<version>/)"
        type: choice
        options: ["2.7.8", "2.6.23"]
        default: "2.7.8"
  push:
    branches: ["ccr-4fe5c52b-absjlg"]
    paths:
      - "pre-build.sh"
      - "variables"
      - "patches/openvpn-xor-*/**"
      - "configs/*.config"
      - ".github/workflows/build-padavan-xor.yml"

jobs:
  build:
    name: "Build ${{ matrix.config }}"
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults: { run: { shell: bash } }
    env:
      OPENVPN_VERSION: ${{ inputs.openvpn_version || '2.7.8' }}
    strategy:
      fail-fast: false
      matrix:
        config: [MI-4A_100M, MI-4C, MI-R3Gv2]

    steps:
    - uses: actions/checkout@v4

    - name: Get variables
      run: |
        sed -i 's|\r$||g' variables "configs/${{ matrix.config }}.config"
        . <(cat variables "configs/${{ matrix.config }}.config")
        PADAVAN_THEMES="${PADAVAN_THEMES[*]}"
        for v in "${!PADAVAN_@}" "${!CONFIG_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    - name: Download sources and toolchain
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C padavan-ng checkout "$PADAVAN_COMMIT"
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

    - name: Install themes
      run: |
        if [[ -n $PADAVAN_THEMES ]]; then
          git clone --depth 1 -b "$PADAVAN_THEMES_BRANCH" "$PADAVAN_THEMES_REPO" themes
          cp -r themes/common-theme themes/jquery.js padavan-ng/trunk/user/www/n56u_ribbon_fixed

          for theme in $PADAVAN_THEMES; do
            echo "Installing $theme theme"
            cp -r "themes/$theme-theme" padavan-ng/trunk/user/www/n56u_ribbon_fixed
          done
        fi

    - name: Replace OpenVPN (${{ env.OPENVPN_VERSION }}) and apply XOR patch
      run: . pre-build.sh

    - name: Build firmware
      run: |
        cp "configs/${{ matrix.config }}.config" padavan-ng/trunk/.config
        cd padavan-ng/trunk
        ./clear_tree.sh
        ./build_firmware.sh
        FW_FILE_NAME="$(find images -type f -regextype posix-extended -iregex ".*\.(trx|bin)$" \
                        -printf "%T@\t%f\n" | sort -V | tail -1 | cut -f2)"
        [[ -n $FW_FILE_NAME ]] || { echo "Firmware file not found"; exit 1; }
        echo "FW_FILE_NAME=$FW_FILE_NAME" >> $GITHUB_ENV

    - name: Check firmware size
      run: |
        partitions=padavan-ng/trunk/configs/boards/$CONFIG_VENDOR/$CONFIG_FIRMWARE_PRODUCT_ID/partitions.config
        max_fw_size="$(awk '/Firmware/ { getline; getline; sub(",", ""); print strtonum($2); }' "$partitions")"
        fw_size="$(stat -c %s "padavan-ng/trunk/images/$FW_FILE_NAME")"
        echo "Firmware: $FW_FILE_NAME  size=$fw_size  max=$max_fw_size"
        if ((fw_size > max_fw_size)); then
          echo "Firmware size ($fw_size) exceeds max ($max_fw_size) for ${{ matrix.config }}"
          exit 1
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: padavan-xor-openvpn${{ env.OPENVPN_VERSION }}-${{ matrix.config }}
        retention-days: 7
        path: |
          padavan-ng/trunk/images/${{ env.FW_FILE_NAME }}
          configs/${{ matrix.config }}.config
