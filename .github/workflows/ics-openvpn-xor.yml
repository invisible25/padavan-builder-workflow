# Build schwabe/ics-openvpn with the OpenVPN XOR/scramble obfuscation patch
# applied to the bundled OpenVPN 2.x engine, and publish the APK as an
# artifact. The patch lives in this repo at patches/openvpn-xor-scramble.patch.
name: Build ics-openvpn (XOR scramble)

permissions:
  contents: read

on:
  push:
    branches: ["ccr-4fe5c52b-absjlg"]
  workflow_dispatch:

jobs:
  build:
    name: Build patched (XOR scramble) APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (holds the patch)
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Checkout schwabe/ics-openvpn (with submodules)
        uses: actions/checkout@v4
        with:
          repository: schwabe/ics-openvpn
          submodules: recursive
          path: ics-openvpn

      - name: Apply OpenVPN XOR scramble patch
        working-directory: ics-openvpn/main/src/main/cpp/openvpn
        run: |
          set -e
          PATCH="$GITHUB_WORKSPACE/workflow-repo/patches/openvpn-xor-scramble.patch"
          echo "OpenVPN submodule at commit: $(git rev-parse HEAD)"
          if git apply --verbose "$PATCH"; then
            echo "Patch applied via: git apply"
          else
            echo "git apply failed; falling back to patch -p1"
            patch -p1 < "$PATCH"
          fi
          echo "----- resulting diffstat -----"
          git --no-pager diff --stat || true

      - name: Use debug signing
        run: |
          mkdir -p ~/.gradle
          printf 'icsopenvpnDebugSign=true\norg.gradle.jvmargs=-Xmx2048M\n' > ~/.gradle/gradle.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4

      - name: Build UiOvpn2 release (OpenVPN 2.x engine - scramble active here)
        working-directory: ics-openvpn
        run: ./gradlew --no-daemon assembleUiOvpn2Release

      - name: Build UiOvpn23 release (bundles OpenVPN 2 and 3)
        working-directory: ics-openvpn
        run: ./gradlew --no-daemon assembleUiOvpn23Release

      - name: List built APKs
        if: always()
        working-directory: ics-openvpn
        run: find main/build/outputs/apk -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ics-openvpn-xor-apk
          path: ics-openvpn/main/build/outputs/apk/**/*.apk
          if-no-files-found: error
